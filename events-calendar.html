<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027 CINC Event Calendar</title>
<style>
@font-face{font-family:Lato;src:url(assets/Lato-Regular.ttf)}
@font-face{font-family:Lato;src:url(assets/Lato-Bold.ttf);font-weight:700}

/* Layout concept: one quiet agenda list under a sticky control bar. Month label on the left, one row per event, a color dot for category. */
:root{--bg:#f5f8f9;--surface:#ffffff;--ink:#101828;--body:#34495a;--muted:#5f7480;--rule:#e2e9ec;--hair:#edf2f4;--accent:#069dc7;--accent-ink:#08748f;--accent-soft:#e6f5fa;--warn:#b42318;--warn-soft:#fdecea;
--c-tom:#069dc7;--c-brokerage:#101828;--c-industry:#0b7fa0;--c-other:#8aa0ac;--c-edge:#12b76a;
--font:Lato,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;font-size:15px}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 0}
header.top img{height:36px;width:auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(26px,3.4vw,40px);letter-spacing:-1px;margin:26px 0 6px;line-height:1.1;text-wrap:balance}
.lead{margin:0 0 20px;color:var(--muted);font-size:15px;max-width:48em}
/* sticky control bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.bar::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.row1,.row2{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-size:13px;font-weight:700}
.chip .n{font-weight:400;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .n{color:var(--bg);opacity:.7}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.jump{display:flex;flex-wrap:wrap;gap:2px}
.jump button{border:0;background:none;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--accent-ink)}
.jump button:hover{background:var(--accent-soft)}
.jump button[disabled]{color:var(--muted);opacity:.45;cursor:default;background:none}
.showing{font-size:12px;color:var(--muted)}
/* overlaps: one slim disclosure */
details.overlaps{margin:12px 0 0;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
details.overlaps summary{cursor:pointer;list-style:none;padding:9px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
details.overlaps summary::-webkit-details-marker{display:none}
details.overlaps summary::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
details.overlaps summary::after{content:"Show";margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}
details.overlaps[open] summary::after{content:"Hide"}
details.overlaps ul{margin:0;padding:0 14px 12px 32px;color:var(--body);font-size:13.5px}
details.overlaps li{padding:3px 0}
/* agenda */
.month{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0 24px;padding:22px 0;border-bottom:1px solid var(--rule);scroll-margin-top:calc(var(--tb,110px) + 4px)}
.mlabel{position:sticky;top:calc(var(--tb,110px) + 22px);align-self:start;display:flex;flex-direction:column;gap:2px}
.mlabel b{font-size:20px;letter-spacing:-.4px}
.mlabel span{font-size:12px;color:var(--muted)}
.month.empty .mlabel b{color:var(--muted);font-weight:400}
.rows{display:flex;flex-direction:column;min-width:0}
.row{display:grid;grid-template-columns:10px 112px minmax(0,1.4fr) minmax(0,1fr);gap:0 14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--hair)}
.row:first-child{border-top:0;padding-top:2px}
.dot{width:9px;height:9px;border-radius:50%;align-self:center;display:inline-block}
.date{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.name{font-weight:700;color:var(--ink);line-height:1.3}
.det{font-size:12.5px;color:var(--muted);margin-top:1px}
.loc{font-size:13px;color:var(--muted)}
.badge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;vertical-align:1px}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.row.edge{grid-template-columns:10px 112px minmax(0,1fr)}
.row.edge .main{grid-column:3}
.stops{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:3px}
.stop{font-size:13px;color:var(--body);white-space:nowrap}
.stop b{color:var(--ink)}
.stop em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--warn);margin-left:4px}
.emptyline{font-size:13px;color:var(--muted);padding-top:4px}
h2.sec{font-size:18px;letter-spacing:-.3px;margin:34px 0 0;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.tbdrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0 24px;padding:14px 0;border-bottom:1px solid var(--hair)}
.tbdrow b{font-size:15px}
.tbdrow span.c{display:block;font-size:12px;color:var(--muted);font-weight:400}
/* category view */
.cat{margin-top:22px}
.cat h3{display:flex;align-items:center;gap:9px;font-size:16px;margin:0 0 6px}
.cat h3 span{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);padding:8px 10px 8px 0;border-bottom:1px solid var(--rule)}
td{padding:9px 10px 9px 0;border-top:1px solid var(--hair);vertical-align:top;color:var(--body)}
td.dt{font-weight:700;color:var(--ink);white-space:nowrap}
td.nm{font-weight:700;color:var(--ink)}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hide{display:none!important}
@media(max-width:760px){
.month,.tbdrow{grid-template-columns:1fr;gap:6px}
.mlabel{position:static;flex-direction:row;align-items:baseline;gap:10px}
.row{grid-template-columns:10px minmax(0,1fr);gap:2px 10px}
.row .date{grid-column:2}
.row .main{grid-column:2}
.row .loc{grid-column:2}
.row.edge{grid-template-columns:10px minmax(0,1fr)}
.row.edge .main{grid-column:2}
.jump{display:none}
}

@media print{
@page{size:A4 landscape;margin:10mm}
body{background:#fff;padding:0;font-size:12px}
.bar,.seg,.jump,.showing,details.overlaps summary::after{display:none!important}
.bar::before{display:none}
details.overlaps{border:0;margin:6px 0 10px}
details.overlaps summary{padding:0 0 4px}
.month{break-inside:avoid;grid-template-columns:120px minmax(0,1fr);padding:10px 0}
.mlabel{position:static}
.cat{break-inside:avoid}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><img src="assets/cinc-logo-light-bg.svg" alt="CINC"><span class="eyebrow">2027 Annual Plan / Event calendar</span></header>
<h1>2027 CINC Event Calendar</h1>
<p class="lead" id="lead"></p>
<div class="bar" id="bar">
  <div class="row1"><div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  <div class="seg" role="group" aria-label="View"><button id="v-month" class="on" type="button">By month</button><button id="v-cat" type="button">By category</button></div></div>
  <div class="row2"><div class="jump" id="jump" aria-label="Jump to month"></div><div class="showing" id="showing"></div></div>
</div>
<details class="overlaps" id="overlaps"><summary id="overlaps-sum"></summary><ul id="overlaps-list"></ul></details>
<main id="view-month"><div id="months"></div><div id="tbd-wrap"><h2 class="sec">Dates to be announced</h2><div id="tbd"></div></div></main>
<main id="view-cat" class="hide"></main>
<footer><span>Confidential · Internal</span><span>CINC · 2027 Annual Plan</span></footer>
</div>
<script>
const CATS = {
  tom: { name: 'Tom Ferry', color: 'var(--c-tom)' },
  brokerage: { name: 'Brokerage', color: 'var(--c-brokerage)' },
  industry: { name: 'Industry', color: 'var(--c-industry)' },
  edge: { name: 'TF Regional Edge Events', color: 'var(--c-edge)' },
  other: { name: 'Other', color: 'var(--c-other)' }
};
// start/end are used to order events and detect overlaps. Month-only events are marked tentative.
const EVENTS = [
  { cat:'tom', name:'Elite Retreat', start:'2027-02-17', end:'2027-02-18', label:'Feb. 17–18', venue:'MGM Grand', city:'Las Vegas, NV', details:'Elite Coaching members. Early check-in Feb. 16.' },
  { cat:'tom', name:'InnerCircle Mastermind at Elite Retreat', start:'2027-02-19', end:'2027-02-19', label:'Feb. 19', venue:'', city:'Las Vegas, NV', details:'Private bonus day. Combined program runs Feb. 17–19.' },
  { cat:'tom', name:'InnerCircle Retreat', start:'2027-05-13', end:'2027-05-14', label:'May 13–14', venue:'', city:'New York, NY', details:'InnerCircle members.' },
  { cat:'tom', name:'Success Summit', start:'2027-08-24', end:'2027-08-26', label:'Aug. 24–26', venue:'Anaheim Convention Center', city:'Anaheim, CA', details:'Public conference with a private InnerCircle lunch.' },
  { cat:'tom', name:'InnerCircle Retreat', start:'2027-11-03', end:'2027-11-04', label:'Nov. 3–4', venue:'', city:'Jackson, WY', details:'InnerCircle members.' },
  { cat:'brokerage', name:'Keller Williams Family Reunion', start:'2027-02-19', end:'2027-02-22', label:'Feb. 19–22', venue:'George R. Brown Convention Center', city:'Houston, TX', details:'' },
  { cat:'brokerage', name:'Century 21 ONE21 Experience', start:'2027-02-27', end:'2027-03-02', label:'Feb. 27–Mar. 2', venue:'Music City Center', city:'Nashville, TN', details:'Final celebration Mar. 1. Departure Mar. 2.' },
  { cat:'brokerage', name:'Berkshire Hathaway HomeServices Sales Convention', start:'2027-03-07', end:'2027-03-09', label:'Mar. 7–9', venue:'Colorado Convention Center', city:'Denver, CO', details:'' },
  { cat:'brokerage', name:'Keller Williams Mega Camp', start:'2027-08-01', end:'2027-08-31', label:'August', venue:'', city:'Austin, TX', details:'Dates and location pending organizer confirmation.', tentative:true },
  { cat:'brokerage', name:'Coldwell Banker Generation Blue Experience', start:'2027-09-21', end:'2027-09-24', label:'Sept. 21–24', venue:'', city:'Los Angeles, CA', details:'Venue unverified.' },
  { cat:'brokerage', name:'Real RISE 2027', start:'2027-09-27', end:'2027-09-29', label:'Sept. 27–29', venue:'', city:'Atlanta, GA', details:'Official onsite hotel is Signia by Hilton Atlanta Georgia World Congress Center.' },
  { cat:'brokerage', name:'eXpcon USA', start:'2027-10-04', end:'2027-10-06', label:'Oct. 4–6', venue:'Anaheim Convention Center', city:'Anaheim, CA', details:'' },
  { cat:'brokerage', name:'LPT Realty FALLCON', start:'2027-11-01', end:'2027-11-30', label:'November', venue:'', city:'Tampa, FL', details:'Exact dates TBD.', tentative:true },
  { cat:'industry', name:'Inman Connect New York', start:'2027-01-26', end:'2027-01-28', label:'Jan. 26–28', venue:'New York Hilton Midtown', city:'New York, NY', details:'' },
  { cat:'industry', name:'LeadingRE LIMITLESS', start:'2027-03-22', end:'2027-03-24', label:'Mar. 22–24', venue:'Wynn Las Vegas', city:'Las Vegas, NV', details:'' },
  { cat:'industry', name:'HousingWire: The Gathering', start:'2027-04-12', end:'2027-04-15', label:'Apr. 12–15', venue:'Omni PGA Frisco Resort', city:'Frisco, TX', details:'' },
  { cat:'industry', name:'Inman Connect San Diego', start:'2027-07-27', end:'2027-07-30', label:'July 27–30', venue:'Marriott Marquis San Diego Marina', city:'San Diego, CA', details:'' },
  { cat:'industry', name:'RISMedia CEO & Leadership Exchange', start:'2027-09-01', end:'2027-09-30', label:'September', venue:'', city:'Washington, D.C.', details:'Exact dates TBD.', tentative:true },
  { cat:'industry', name:'Zillow Unlock', start:'2027-10-25', end:'2027-10-28', label:'Oct. 25–28', venue:'MGM Grand', city:'Las Vegas, NV', details:'' },
  { cat:'industry', name:'Blueprint Vegas', start:'2027-10-26', end:'2027-10-28', label:'Oct. 26–28', venue:'The Venetian', city:'Las Vegas, NV', details:'' },
  { cat:'other', name:'Glover U Live Unreal Summit', start:'2027-01-18', end:'2027-01-21', label:'Jan. 18–21', venue:'Gaylord Palms Resort & Convention Center', city:'Kissimmee, FL (Orlando area)', details:'Agents, team leaders, and brokerage owners.' },
  { cat:'other', name:'Glover U Live Unreal LeadUp: Spring', start:'2027-04-26', end:'2027-04-28', label:'Apr. 26–28', venue:'Laguna Cliffs Marriott Resort & Spa', city:'Dana Point, CA', details:'Brokerage owners, lead agents, and team leaders who meet Glover U’s qualifications.' }
].concat([
  ['Q1','Las Vegas','2027-03-12','Mar. 12'], ['Q1','Portland','2027-03-17','Mar. 17'], ['Q1','Reno','2027-03-19','Mar. 19'],
  ['Q2','Phoenix','2027-04-21','Apr. 21'], ['Q2','Dallas','2027-04-22','Apr. 22'], ['Q2','Houston','2027-04-23','Apr. 23'], ['Q2','Seattle','2027-04-28','Apr. 28'],
  ['Q2','Cincinnati','2027-05-12','May 12'], ['Q2','Vancouver','2027-05-21','May 21'], ['Q2','Toronto','2027-05-26','May 26'], ['Q2','Chicago','2027-05-27','May 27'],
  ['Q2','Buffalo','2027-05-28','May 28'], ['Q2','Indianapolis','2027-06-16','June 16'], ['Q2','Boise','2027-06-23','June 23'], ['Q2','Nashville','2027-06-25','June 25'],
  ['Q3','Austin'], ['Q3','Salt Lake City'], ['Q3','Denver'],
  ['Q4','Long Island'], ['Q4','Boston'], ['Q4','Washington, DC'], ['Q4','Philadelphia'], ['Q4','St. Louis'], ['Q4','Cleveland'], ['Q4','San Jose']
].map(([q, city, start, label]) => start
  ? { cat:'edge', name:'Regional Edge', start, end:start, label, venue:'', city, details:q + ' stop', quarter:q }
  : { cat:'edge', name:'Regional Edge', start:null, end:null, label:q + ' · date TBD', venue:'', city, details:q + ' stop. Date to be announced.', quarter:q, tbd:true })
).sort((a, b) => (a.start || '9999-' + a.quarter).localeCompare(b.start || '9999-' + b.quarter) || a.name.localeCompare(b.name) || a.city.localeCompare(b.city));
const OVERLAPS = [
  'Feb. 19. The InnerCircle Mastermind in Las Vegas overlaps with the first day of Keller Williams Family Reunion in Houston.',
  'Oct. 26–28. Zillow Unlock and Blueprint Vegas overlap for three days in Las Vegas.',
  'Apr. 28. TF Regional Edge in Seattle overlaps with the last day of Glover U Live Unreal LeadUp in Dana Point.'
];
const overlapIds = new Set();
EVENTS.forEach((a, i) => EVENTS.forEach((b, j) => { if (i < j && a.start && b.start && !a.tentative && !b.tentative && a.start <= b.end && b.start <= a.end && a.city.split(',')[0] !== b.city.split(',')[0]) { overlapIds.add(i); overlapIds.add(j); } }));
EVENTS.forEach((e, i) => { e.overlap = overlapIds.has(i) || (e.name === 'Zillow Unlock' || e.name === 'Blueprint Vegas'); });

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let filter = 'all', view = 'month';
const $ = id => document.getElementById(id);
function where(e) { return [e.venue, e.city].filter(Boolean).join(', '); }
function overlapFlag(e) { return e.overlap || overlapIds.has(EVENTS.indexOf(e)) || e.name === 'Zillow Unlock' || e.name === 'Blueprint Vegas'; }
function badges(e) { return (e.tentative ? '<span class="badge">Tentative</span>' : '') + (overlapFlag(e) ? '<span class="badge warn">Overlap</span>' : ''); }
function row(e) {
  return '<div class="row"><span class="dot" style="background:' + CATS[e.cat].color + '"></span><span class="date">' + esc(e.label) + '</span><div class="main"><div class="name">' + esc(e.name) + badges(e) + '</div>' +
    (e.details ? '<div class="det">' + esc(e.details) + '</div>' : '') + '</div><div class="loc">' + esc(where(e)) + '</div></div>';
}
function edgeRow(list) {
  return '<div class="row edge"><span class="dot" style="background:' + CATS.edge.color + '"></span><span class="date"></span><div class="main"><div class="name">Regional Edge</div><div class="stops">' +
    list.map(e => '<span class="stop"><b>' + esc(e.city) + '</b> ' + esc(e.label) + (overlapFlag(e) ? '<em>Overlap</em>' : '') + '</span>').join('') + '</div></div></div>';
}
function render() {
  const list = EVENTS.filter(e => filter === 'all' || e.cat === filter);
  const tbdAll = EVENTS.filter(e => e.tbd).length;
  $('lead').textContent = EVENTS.length + ' events across ' + Object.keys(CATS).length + ' categories, by month. Tentative dates and locations are marked.' + (tbdAll ? ' ' + tbdAll + ' Regional Edge stops have dates to be announced.' : '');
  $('chips').innerHTML = [['all', 'All', EVENTS.length, null]].concat(Object.keys(CATS).map(k => [k, CATS[k].name, EVENTS.filter(e => e.cat === k).length, CATS[k].color]))
    .map(([k, name, n, color]) => '<button type="button" class="chip' + (filter === k ? ' on' : '') + '" data-f="' + k + '">' + (color ? '<i style="background:' + color + '"></i>' : '') + esc(name) + ' <span class="n">' + n + '</span></button>').join('');
  $('showing').textContent = 'Showing ' + list.length + ' of ' + EVENTS.length + ' events';
  $('overlaps-sum').textContent = OVERLAPS.length + ' scheduling overlaps';
  $('overlaps-list').innerHTML = OVERLAPS.map(t => '<li>' + esc(t) + '</li>').join('');
  $('jump').innerHTML = MONTHS.map((m, i) => '<button type="button" data-m="' + i + '"' + (list.some(e => e.start && Number(e.start.slice(5, 7)) - 1 === i) ? '' : ' disabled') + '>' + SHORT[i] + '</button>').join('');
  $('months').innerHTML = MONTHS.map((m, mi) => {
    const evs = list.filter(e => e.start && Number(e.start.slice(5, 7)) - 1 === mi);
    const edge = evs.filter(e => e.cat === 'edge'), other = evs.filter(e => e.cat !== 'edge');
    const rows = evs.length ? other.map(row).join('') + (edge.length ? edgeRow(edge) : '') : '<div class="emptyline">No events scheduled</div>';
    return '<section class="month' + (evs.length ? '' : ' empty') + '" id="m' + mi + '"><div class="mlabel"><b>' + m + '</b><span>' + (evs.length ? evs.length + (evs.length === 1 ? ' event' : ' events') : '') + '</span></div><div class="rows">' + rows + '</div></section>';
  }).join('');
  const tbd = list.filter(e => e.tbd);
  $('tbd-wrap').classList.toggle('hide', !tbd.length);
  $('tbd').innerHTML = ['Q3', 'Q4'].map(q => {
    const evs = tbd.filter(e => e.quarter === q);
    return evs.length ? '<div class="tbdrow"><div><b>' + q + ' · date TBD</b><span class="c">' + evs.length + (evs.length === 1 ? ' stop' : ' stops') + '</span></div><div class="row edge" style="border:0;padding:0"><span class="dot" style="background:' + CATS.edge.color + '"></span><span class="date"></span><div class="main"><div class="name">Regional Edge</div><div class="stops">' +
      evs.map(e => '<span class="stop"><b>' + esc(e.city) + '</b></span>').join('') + '</div></div></div></div>' : '';
  }).join('');
  $('view-cat').innerHTML = Object.keys(CATS).filter(k => filter === 'all' || filter === k).map(k => {
    const evs = EVENTS.filter(e => e.cat === k);
    return '<section class="cat"><h3><i class="dot" style="background:' + CATS[k].color + '"></i>' + esc(CATS[k].name) + ' events<span>' + evs.length + ' events</span></h3><div class="tw"><table><thead><tr><th>2027 dates</th><th>Event</th><th>Location</th><th>Details</th></tr></thead><tbody>' +
      evs.map(e => '<tr><td class="dt">' + esc(e.label) + '</td><td class="nm">' + esc(e.name) + '</td><td>' + esc(where(e)) + '</td><td>' + esc(e.details || '—') + (e.tentative ? '<span class="badge">Tentative</span>' : '') + '</td></tr>').join('') + '</tbody></table></div></section>';
  }).join('');
  $('view-month').classList.toggle('hide', view !== 'month');
  $('view-cat').classList.toggle('hide', view !== 'cat');
  $('jump').classList.toggle('hide', view !== 'month');
  $('v-month').classList.toggle('on', view === 'month');
  $('v-cat').classList.toggle('on', view === 'cat');
  measure();
}
function measure() { document.documentElement.style.setProperty('--tb', $('bar').offsetHeight + 'px'); }
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; render(); } });
$('jump').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b && !b.disabled) { const el = $('m' + b.dataset.m); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
