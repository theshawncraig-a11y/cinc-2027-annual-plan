<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINC 2027 Annual Plan</title><style>
@font-face{font-family:Lato;src:url(assets/Lato-Regular.ttf)}@font-face{font-family:Lato;src:url(assets/Lato-Bold.ttf);font-weight:700}
:root{--cinc-blue:#069dc7;--etta-green:#12b76a;--blue-black:#101828;--cinc-yellow:#fedf3d;--ink-muted:#5a6e79;--rule:#dce5e8;--blue-10:#e6f5fa;--blue-20:#cdebf4;--green-10:#e7f8f0}
*{box-sizing:border-box}
body{margin:0;background:#edf2f3;color:var(--blue-black);font-family:Lato,Arial}
button{font:inherit;cursor:pointer;border:1px solid #d3dfe3;background:white;color:var(--blue-black);padding:10px 17px;border-radius:3px}
button:hover{border-color:var(--cinc-blue)}button:disabled{opacity:.3;cursor:default}
button.active{background:var(--blue-black);color:white;border-color:var(--blue-black)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;font-weight:700;color:#60747e}
.toolbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;border-bottom:1px solid #d9e1e4;background:white;gap:10px}
.toolbar div{display:flex;gap:7px}
.deck{height:calc(100dvh - 66px);padding:25px 3vw;display:flex;align-items:center;justify-content:center}
/* Widescreen 16:9 sheet: as wide as the viewport allows while still fitting vertically */
.sheet{position:relative;overflow:hidden;aspect-ratio:16/9;width:min(100%,1600px,calc((100dvh - 116px) * 16 / 9));background:white;display:flex;flex-direction:column;padding:clamp(14px,1.9cqw,30px) clamp(22px,2.8cqw,44px) clamp(10px,1.2cqw,20px);border:1px solid #dde5e8;box-shadow:0 14px 45px #10182809;container-type:inline-size}
.brandline{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:clamp(10px,1.1cqw,16px)}
.brandline img{height:clamp(32px,3.4cqw,56px);width:auto}
.brandline .logo-dark{display:none}
.heading{display:flex;align-items:start;justify-content:space-between;gap:24px;padding:clamp(18px,2.2cqw,34px) 0 clamp(16px,2cqw,32px)}
.heading-actions{display:flex;align-items:center;align-self:center;flex-shrink:0}
h1{font-size:clamp(22px,2.6cqw,40px);letter-spacing:-1px;margin:8px 0 8px;line-height:1.13}
p{margin:0;color:var(--ink-muted);font-size:clamp(13px,1.05cqw,16px)}
.chapter{color:var(--cinc-blue);font-size:12px;font-weight:bold;letter-spacing:1.6px;text-transform:uppercase}
.canvas{flex:1;min-height:0;display:flex;align-items:stretch;padding:0 0 clamp(12px,1.6cqw,26px)}
.footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--rule);padding-top:12px;font-size:12px;color:#60747e;gap:8px 16px;flex-wrap:wrap}
.footer .nav{display:flex;align-items:center;gap:12px;margin-left:auto}
.footer button{padding:clamp(6px,.75cqw,11px) clamp(10px,1.3cqw,18px);font-size:clamp(11px,.95cqw,14px)}
.pattern{display:none;position:absolute;inset:0;pointer-events:none}

/* ---------- Index slide: one card per channel ---------- */
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.2cqw,20px);width:100%;align-self:stretch}
.pillar{display:flex;flex-direction:column;text-align:left;padding:clamp(12px,1.4cqw,22px);border:1px solid var(--rule);border-top:4px solid var(--cinc-blue);border-radius:4px;background:#f8fafb;transition:box-shadow .15s,transform .15s}
.pillar:hover,.pillar:focus-visible{box-shadow:0 10px 28px #10182814;transform:translateY(-2px);border-color:var(--rule);border-top-color:var(--cinc-blue);outline:0}
.pillar h2{font-size:clamp(15px,1.35cqw,21px);margin:clamp(2px,.4cqw,6px) 0 clamp(16px,1.9cqw,30px);line-height:1.2;min-height:2.4em;display:flex;align-items:flex-start}
.pillar-logo{display:block;height:clamp(22px,2.1cqw,32px);width:auto;max-width:100%}
.pillar ul{list-style:none;margin:0;padding:0;flex:1}
.pillar li{position:relative;padding:5px 0 5px 16px;font-size:clamp(12px,1cqw,15px);color:#34495a;border-top:1px solid #e6edf0}
.pillar li:before{content:'';position:absolute;left:0;top:11px;width:7px;height:7px;border-radius:50%;background:var(--etta-green)}
.pillar .go{margin-top:14px;font-size:12px;font-weight:700;color:var(--cinc-blue);letter-spacing:.6px;text-transform:uppercase}

/* ---------- Generic detail slide: sub-item cards + bottom line ---------- */
.detail{display:flex;flex-direction:column;gap:clamp(10px,1.2cqw,18px);width:100%}
.items{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:clamp(10px,1.2cqw,18px);flex:1;min-height:0}
.item{border:1px solid var(--rule);border-radius:4px;background:white;display:flex;flex-direction:column;overflow:hidden}
.item h3{margin:0;padding:12px 16px;background:var(--blue-10);color:var(--blue-black);font-size:clamp(14px,1.2cqw,19px);border-bottom:1px solid var(--blue-20)}
.item dl{margin:0;padding:6px 16px 10px;flex:1}
.item dt{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;color:#60747e;margin-top:10px}
.item dd{margin:3px 0 0;font-size:clamp(12px,1cqw,15px);color:#34495a;line-height:1.35}
.item dd.todo{color:#8a9ba5;font-style:italic}
.bottomline{background:var(--blue-black);color:white;border-radius:8px;padding:clamp(12px,1.3cqw,20px) clamp(16px,1.8cqw,28px);display:flex;gap:18px;align-items:center}
.bottomline .label{color:#4fc6e8;white-space:nowrap}
.bottomline span:last-child{font-size:clamp(13px,1.15cqw,18px);font-weight:700}
.bottomline span.todo{font-weight:400;color:#b7c3cb;font-style:italic}

/* ---------- Tom Ferry plan slide ---------- */
.traction{display:flex;align-items:center;gap:clamp(10px,1.2cqw,18px);border:1px solid var(--rule);border-left:4px solid var(--etta-green);border-radius:4px;background:var(--green-10);padding:clamp(8px,.9cqw,14px) clamp(12px,1.4cqw,22px)}
.traction .big{font-size:clamp(26px,2.8cqw,44px);font-weight:700;line-height:1;letter-spacing:-1.5px;color:var(--blue-black)}
.traction .meta{display:flex;flex-direction:column;gap:3px}
.traction .meta b{font-size:clamp(12px,1cqw,15px);color:var(--blue-black)}
.traction .meta span{font-size:clamp(11px,.85cqw,13px);color:var(--ink-muted)}
.traction .bar{width:clamp(90px,9cqw,150px);height:6px;background:#cfe9dc;border-radius:3px;overflow:hidden}
.traction .bar i{display:block;height:100%;background:var(--etta-green);border-radius:3px}
.tf{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(10px,1.2cqw,18px);width:100%;min-height:0}
.tf .card{border:1px solid var(--rule);border-radius:4px;background:white;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.tf .card h3{margin:0;padding:clamp(6px,.8cqw,13px) clamp(12px,1.3cqw,18px);background:var(--blue-10);font-size:clamp(12px,1.15cqw,18px);border-bottom:1px solid var(--blue-20);display:flex;justify-content:space-between;align-items:center;gap:10px}
.tf .card .body{padding:clamp(6px,.8cqw,14px) clamp(12px,1.3cqw,18px);flex:1;min-height:0}
.tf .lead{font-size:clamp(12px,1cqw,15px);color:#34495a;margin:0 0 clamp(6px,.7cqw,10px)}
.events{display:flex;flex-direction:column;gap:0;height:100%}
.event{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.3fr);gap:6px 14px;padding:clamp(7px,.75cqw,11px) 0;border-top:1px solid #e6edf0;align-items:start}
.event .name{font-weight:700;font-size:clamp(12px,1.05cqw,16px);color:var(--blue-black)}
.event .when{font-size:clamp(11px,.85cqw,13px);color:var(--ink-muted);margin-top:2px}
.event .do{font-size:clamp(11.5px,.95cqw,14.5px);color:#34495a;line-height:1.35}
.event .do b{color:var(--blue-black)}
.compact{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(10px,1.2cqw,18px);min-height:0}
.compact ul{list-style:none;margin:0;padding:0}
.compact li{position:relative;padding:clamp(1px,.2cqw,3px) 0 clamp(1px,.2cqw,3px) 14px;font-size:clamp(10px,.95cqw,14.5px);color:#34495a;line-height:1.35}
.compact li:before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--cinc-blue)}
.chip{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap}
.chip.done{background:var(--etta-green);color:white}
.chip.live{background:var(--cinc-blue);color:white}
.chip.next{background:var(--cinc-blue);color:var(--blue-black)}
.chip.tbd{background:#e1e7ea;color:#4c6270}


/* ---------- Partnership tracker showcase ---------- */
.tracker{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,2fr);gap:clamp(14px,1.8cqw,28px);width:100%;min-height:0}
.tracker-side{display:flex;flex-direction:column;gap:clamp(10px,1.3cqw,20px);min-height:0}
.tracker-eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--cinc-blue)}
.tracker-purpose{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(8px,1cqw,14px)}
.tracker-purpose li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.tracker-purpose .n{grid-row:span 2;font-size:clamp(20px,2.2cqw,34px);font-weight:700;letter-spacing:-1px;line-height:1;color:var(--cinc-blue)}
.tracker-purpose b{font-size:clamp(13px,1.15cqw,17px);color:var(--blue-black)}
.tracker-purpose span{font-size:clamp(11.5px,.95cqw,14.5px);color:#34495a;line-height:1.35}
.brand-left{display:flex;align-items:center;gap:clamp(10px,1.2cqw,18px)}
.partner{display:flex;align-items:center;gap:clamp(10px,1.2cqw,18px)}
.partner[hidden]{display:none}
.partner i{font-style:normal;font-size:20px;color:#9bb0ba;font-weight:400}
.brandline .partner img{height:clamp(24px,2.3cqw,34px)}
.tracker-tabs{display:flex;flex-wrap:wrap;gap:6px}
.tracker-tabs button{font-size:clamp(11px,.9cqw,13px);padding:6px 11px;border-radius:999px}
.tracker-tabs button.active{background:var(--cinc-blue);border-color:var(--cinc-blue);color:white}
.tracker-caption{font-size:clamp(11.5px,.95cqw,14.5px);color:#34495a;line-height:1.4;margin:0}
.tracker-caption b{color:var(--blue-black)}
.tracker-foot{margin-top:auto;display:flex;flex-direction:column;gap:3px}
.tracker-link{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--cinc-blue);text-decoration:none}
.tracker-link:hover{text-decoration:underline}
.tracker-lock{font-size:12px;color:#60747e}.tracker-lock b{color:var(--blue-black);letter-spacing:.3px;user-select:all}
.shot{position:relative;min-height:0;background:#0d1524;border:1px solid #1d2a40;border-radius:8px;box-shadow:0 14px 40px #10182822;overflow:hidden;cursor:zoom-in}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.shot .zoom{position:absolute;right:10px;bottom:10px;background:#0d1524cc;color:#cfe0f5;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;padding:5px 9px;border-radius:999px;border:1px solid #2a3b57}
.lightbox{display:none;position:fixed;inset:0;background:#05080fe6;z-index:20;align-items:center;justify-content:center;padding:3vh 3vw;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px #000a}

/* ---------- Follow Up Boss growth plan: five steps, what is in place and what happens in 2027 ---------- */
.fub{display:flex;flex-direction:column;gap:clamp(8px,1.2cqw,20px);width:100%;min-height:0}
.fub-headline{margin:0;font-size:clamp(20px,2.7cqw,44px);font-weight:700;letter-spacing:-1px;line-height:1.12;color:var(--blue-black)}
.fub-headline span,.fub-headline em{display:block}
.fub-headline em{font-style:normal;color:var(--cinc-blue)}
.fub-flow{margin:0;font-size:clamp(12px,1.1cqw,17px);color:var(--ink-muted);line-height:1.4}
.fub-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1cqw,16px);flex:1;min-height:0}
.fub-step{display:flex;flex-direction:column;padding:clamp(8px,1cqw,16px);border:1px solid var(--rule);border-top:4px solid var(--cinc-blue);border-radius:4px;background:#f8fafb;min-height:0;overflow:hidden}
.fub-step-head{display:flex;align-items:center;justify-content:space-between;min-height:clamp(30px,3.6cqw,56px);margin-bottom:clamp(2px,.4cqw,8px)}
.fub-num{width:clamp(22px,2.2cqw,34px);aspect-ratio:1;border-radius:50%;background:var(--cinc-blue);color:white;font-weight:700;font-size:clamp(11px,1.1cqw,17px);display:flex;align-items:center;justify-content:center}
.fub-avatar{width:clamp(30px,3.6cqw,56px);aspect-ratio:1;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid white;box-shadow:0 2px 8px #10182830}
.fub-step h3{margin:0 0 clamp(2px,.4cqw,6px);font-size:clamp(12.5px,1.4cqw,21px);line-height:1.2;color:var(--blue-black)}
.fub-step .chip{align-self:flex-start;margin:clamp(2px,.3cqw,5px) 0 0;font-size:clamp(8.5px,.7cqw,10px)}
.fub-lab{font-size:clamp(9px,.78cqw,12px);font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin-top:clamp(4px,.7cqw,10px)}
.fub-lab.done{color:#0b7a49}
.fub-lab.plan{color:#08748f}
.fub-step p{margin:2px 0 0;font-size:clamp(10.5px,1.1cqw,17px);line-height:1.33;color:#34495a}
.fub-step .tracker-link{margin-top:auto;padding-top:clamp(4px,.6cqw,9px)}
.fub-url{display:none;font-size:9px;color:#60747e;word-break:break-all;margin-top:2px}

/* ---------- Targeted outbound lists and ABM: three columns (lists, content, campaigns) plus the Marketing-to-BDR loop ---------- */
.abm{display:flex;flex-direction:column;gap:clamp(8px,1.1cqw,18px);width:100%;min-height:0}
.abm-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1cqw,16px);flex:1;min-height:0}
.abm-col{display:flex;flex-direction:column;border:1px solid var(--rule);border-top:4px solid var(--cinc-blue);border-radius:4px;background:#f8fafb;padding:clamp(8px,1cqw,16px);min-height:0;overflow:hidden}
.abm-col-head{display:flex;align-items:center;gap:clamp(6px,.7cqw,10px);margin-bottom:clamp(6px,.8cqw,12px)}
.abm-col-head h3{margin:0;flex:1;font-size:clamp(12.5px,1.35cqw,20px);line-height:1.2;color:var(--blue-black)}
.abm-col .chip{font-size:clamp(8.5px,.7cqw,10px)}
.abm-seg{margin-bottom:clamp(6px,.8cqw,12px)}
.abm-seg:last-child{margin-bottom:0}
.abm-seg .lab{font-size:clamp(9px,.78cqw,12px);font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#08748f;margin-bottom:clamp(3px,.4cqw,6px)}
.abm-tags{display:flex;flex-wrap:wrap;gap:clamp(3px,.4cqw,6px)}
.abm-tags span{font-size:clamp(10px,.95cqw,14px);font-weight:700;color:var(--blue-black);background:white;border:1px solid var(--blue-20);border-radius:999px;padding:clamp(2px,.3cqw,5px) clamp(7px,.8cqw,12px);line-height:1.25}
.abm-tags span.more{font-weight:400;color:var(--ink-muted);border-style:dashed}
.abm-logos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(4px,.5cqw,8px)}
.abm-logos .tile{display:flex;align-items:center;justify-content:center;height:clamp(30px,3.4cqw,54px);background:white;border:1px solid var(--rule);border-radius:4px;padding:clamp(3px,.45cqw,7px) clamp(5px,.7cqw,11px);overflow:hidden}
.abm-logos .tile img{max-width:100%;max-height:100%;object-fit:contain}
.abm-logos .tile.more{font-size:clamp(10px,.95cqw,14px);color:var(--ink-muted);border-style:dashed}
.abm-col ul{list-style:none;margin:0;padding:0}
.abm-col li{position:relative;padding:clamp(2px,.35cqw,5px) 0 clamp(2px,.35cqw,5px) 14px;font-size:clamp(10.5px,1.05cqw,16px);color:#34495a;line-height:1.35}
.abm-col li:before{content:'';position:absolute;left:0;top:.75em;width:6px;height:6px;border-radius:50%;background:var(--cinc-blue)}
.abm-rows{display:flex;flex-direction:column;gap:clamp(5px,.6cqw,9px)}
.abm-row{display:grid;grid-template-columns:minmax(0,7.5em) 1fr;gap:clamp(6px,.8cqw,12px);align-items:start;padding:clamp(5px,.6cqw,9px) clamp(7px,.8cqw,12px);background:white;border:1px solid var(--rule);border-radius:4px}
.abm-row .lab{font-size:clamp(9px,.78cqw,12px);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#08748f;line-height:1.3;padding-top:.15em}
.abm-row p{margin:0;font-size:clamp(10.5px,1.05cqw,16px);line-height:1.35;color:#34495a}
.abm-row .bdr{display:inline-block;background:var(--blue-black);color:white;font-weight:700;border-radius:999px;padding:1px .65em;white-space:nowrap}
.abm-row .bdr:before{content:'★ ';color:var(--cinc-blue)}
.abm-loop{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:clamp(14px,2cqw,34px);background:linear-gradient(120deg,#0f1a2b 0%,#101828 55%,#16243a 100%);color:white;border-radius:10px;padding:clamp(10px,1.2cqw,20px) clamp(14px,1.8cqw,30px);box-shadow:0 10px 30px #10182826,inset 0 1px 0 #ffffff14;overflow:hidden}
.abm-loop:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--cinc-blue),var(--etta-green))}
.abm-loop .lead{display:flex;flex-direction:column;gap:2px;padding-right:clamp(14px,2cqw,34px);border-right:1px solid #ffffff1f}
.abm-loop .lead .label{color:#4fc6e8;white-space:nowrap;font-size:clamp(9px,.8cqw,12px)}
.abm-loop .lead span{font-size:clamp(9.5px,.9cqw,13px);color:#9fb0bd;white-space:nowrap}
.abm-loop .track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:relative}
.abm-loop .track:before{content:'';position:absolute;left:clamp(6px,.6cqw,9px);right:28%;top:clamp(5px,.55cqw,8px);height:2px;background:linear-gradient(90deg,var(--cinc-blue),#3fc3e6 60%,#ffffff33)}
.abm-loop .node{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;padding:clamp(14px,1.5cqw,22px) clamp(10px,1.2cqw,18px) 0 0}
.abm-loop .node:before{content:'';position:absolute;left:0;top:0;width:clamp(12px,1.2cqw,18px);height:clamp(12px,1.2cqw,18px);border-radius:50%;background:var(--cinc-blue);box-shadow:0 0 0 4px #069dc733}
.abm-loop .node:last-child:before{background:var(--etta-green);box-shadow:0 0 0 4px #12b76a33}
.abm-loop .node .step{font-size:clamp(8.5px,.72cqw,10.5px);font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#6fd3ef;margin-bottom:1px}
.abm-loop .node:last-child .step{color:#5fd99c}
.abm-loop .node b{font-size:clamp(11.5px,1.1cqw,17px);line-height:1.2}
.abm-loop .node span{font-size:clamp(9.5px,.9cqw,13.5px);color:#b7c3cb;line-height:1.3}
@media(max-width:700px){.abm-cols{grid-template-columns:1fr}.abm-loop,.abm-loop .track{grid-template-columns:1fr;gap:6px}.abm-loop .lead{border-right:0}.abm-loop .track:before{display:none}}

/* ---------- How We Win: the CINC Growth Flywheel overview and five stage slides ---------- */
.fwo{display:flex;width:100%;min-height:0;align-items:center;justify-content:center}
.fwo-ring{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.fwo-ring svg{width:100%;height:100%;max-height:100%;font-family:inherit}
.fwo-ring .node{cursor:pointer}
.fwo-ring .node:hover .num{stroke-width:4}
.fwo-ring .node:hover .ttl{fill:var(--cinc-blue)}
.fw{display:flex;flex-direction:column;gap:clamp(8px,1.1cqw,18px);width:100%;min-height:0}

.fw .bottomline{background:linear-gradient(120deg,#0f1a2b,#101828 55%,#16243a);box-shadow:0 10px 30px #10182826,inset 0 1px 0 #ffffff14;border-radius:10px}

.fw-rail button{display:flex;align-items:center;gap:clamp(5px,.6cqw,9px);font:inherit;background:none;border:0;padding:clamp(3px,.4cqw,6px) 0;cursor:pointer;color:var(--ink-muted);text-align:left;min-width:0}

/* ---------- Cost reduction: what we cut and what we invest ---------- */
.cost{display:flex;flex-direction:column;gap:clamp(12px,1.6cqw,28px);width:100%;min-height:0;justify-content:center}

.cost-block.invest{background:linear-gradient(120deg,#0f1a2b,#101828 55%,#16243a);border-color:#101828;color:white;box-shadow:0 10px 30px #10182826,inset 0 1px 0 #ffffff14}

.cost-block.invest .verb{color:white}

.cost-block.invest .big{color:white}
.cost-block .big small{font-size:.5em;letter-spacing:-1px;margin-left:.06em}

.cost-block .into b{color:inherit}
.cost-list{display:flex;flex-direction:column;margin-top:auto}
.cost-list div{display:flex;align-items:center;gap:clamp(8px,1cqw,14px);padding:clamp(7px,.9cqw,13px) 0;border-top:1px solid var(--blue-20);font-size:clamp(14px,1.6cqw,26px);font-weight:700;color:var(--blue-black)}
.cost-list i{width:clamp(8px,.8cqw,12px);height:clamp(8px,.8cqw,12px);border-radius:50%;background:var(--cinc-blue);flex-shrink:0}
@container (max-width:1180px){
.cost-block{padding:clamp(10px,1.4cqw,22px) clamp(12px,1.6cqw,26px);gap:clamp(3px,.5cqw,8px)}

.cost{gap:clamp(8px,1.2cqw,22px)}
}
@media(max-width:700px){.cost-flow{grid-template-columns:1fr}}

/* ---------- Blue footer band on content slides (cover and dividers keep their full blue field) ---------- */
.sheet{--pad-x:clamp(28px,3.5cqw,60px);--pad-b:clamp(12px,1.4cqw,24px);padding:clamp(18px,2.3cqw,38px) var(--pad-x) var(--pad-b)}
.sheet:not([data-page=cover]):not([data-page=divider]) .footer{margin:0 calc(-1 * var(--pad-x)) calc(-1 * var(--pad-b));padding:clamp(10px,1.1cqw,16px) var(--pad-x);background:var(--cinc-blue);border-top:0;color:white}
.sheet:not([data-page=cover]):not([data-page=divider]) .footer .label{color:white;letter-spacing:2px}
.sheet:not([data-page=cover]):not([data-page=divider]) .footer #count{color:white}
.sheet:not([data-page=cover]):not([data-page=divider]) .footer button{background:transparent;color:white;border-color:rgba(255,255,255,.55)}
.sheet:not([data-page=cover]):not([data-page=divider]) .footer button:hover{border-color:white;background:rgba(255,255,255,.12)}
.sheet:not([data-page=cover]):not([data-page=divider]) .footer button:disabled{opacity:.4}
.sheet:not([data-page=cover]):not([data-page=divider]) .canvas{padding-bottom:clamp(14px,1.8cqw,30px)}
.print-foot{display:none}

/* ---------- Cost detail: ad spend and headcount, each with its $1.2M, reasons, and a year-by-year bar view ---------- */
.cd{display:flex;flex-direction:column;gap:clamp(10px,1.4cqw,24px);width:100%;min-height:0}.cd .bottomline{min-height:clamp(34px,4cqw,64px);padding-top:0;padding-bottom:0;flex-shrink:0}

.cd-col{display:flex;flex-direction:column;gap:clamp(5px,.7cqw,12px);min-height:0;border-top:3px solid var(--cinc-blue);padding-top:clamp(8px,1cqw,16px)}
.cd-col:first-child{padding-right:clamp(20px,2.6cqw,44px);border-right:1px solid var(--rule)}
.cd-head{display:flex;align-items:baseline;gap:clamp(10px,1.2cqw,20px);flex-wrap:wrap}
.cd-head .big{font-size:clamp(34px,5cqw,82px);font-weight:700;line-height:.95;letter-spacing:-3px;color:var(--cinc-blue)}
.cd-head .big small{font-size:.5em;letter-spacing:-1px;margin-left:.05em}
.cd-head .ttl{font-size:clamp(15px,1.8cqw,29px);font-weight:700;line-height:1.2;color:var(--blue-black)}
.cd-col ul{list-style:none;margin:0;padding:0}
.cd-col li{position:relative;padding:clamp(3px,.45cqw,8px) 0 clamp(3px,.45cqw,8px) 18px;font-size:clamp(12px,1.38cqw,22px);line-height:1.4;color:var(--ink-body)}
.cd-col li:before{content:'';position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--cinc-blue)}
.cd-bars{margin-top:auto;display:flex;flex-direction:column;gap:clamp(2px,.4cqw,7px);padding-top:clamp(4px,.7cqw,12px);border-top:1px solid var(--rule)}
.cd-bars .lab{font-size:clamp(9px,.72cqw,11px);font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#08748f}
.cd-bar{display:grid;grid-template-columns:clamp(30px,3.4cqw,56px) 1fr clamp(44px,4.4cqw,72px);gap:clamp(6px,.9cqw,14px);align-items:center;font-size:clamp(10.5px,1.1cqw,17px);line-height:1.1;color:var(--ink-body)}

.cd-bar.now .fill{background:var(--cinc-blue)}
.cd-bar .v{font-weight:700;color:var(--blue-black);text-align:right}
.cd-split{display:flex;gap:clamp(8px,1cqw,14px);flex-wrap:wrap}
.cd-split span{font-size:clamp(11px,1cqw,16px);font-weight:700;color:#08748f;background:var(--blue-10);border-radius:999px;padding:clamp(3px,.4cqw,6px) clamp(10px,1.1cqw,16px)}
@media(max-width:700px){.cd-cols{grid-template-columns:1fr}.cd-col:first-child{border-right:0;padding-right:0}}

.cd.three .cd-col{padding-top:clamp(8px,1cqw,16px)}
.cd.three .cd-head{flex-direction:column;align-items:flex-start;gap:clamp(2px,.4cqw,8px)}
.cd.three .cd-head .big{font-size:clamp(34px,4.6cqw,76px)}
@media(max-width:700px){.cd.three .cd-cols{grid-template-columns:1fr}}
/* ---------- Overview: four steps, then the appendix; each part jumps to its slides ---------- */
.ov2{display:flex;flex-direction:column;gap:clamp(8px,1.3cqw,22px);width:100%;min-height:0}
.ov2 button{font:inherit;text-align:left;cursor:pointer;color:var(--blue-black)}
.ov2 button:focus-visible{outline:2px solid var(--cinc-blue);outline-offset:3px}
.ov2-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.8cqw,30px)}
.ov2-card{position:relative;background:var(--blue-10);border:1px solid var(--blue-20);border-top:4px solid var(--cinc-blue);border-radius:var(--radius);padding:clamp(9px,1.3cqw,22px);display:flex;flex-direction:column;gap:clamp(3px,.5cqw,8px);box-shadow:0 3px 10px #10182814;transition:transform .15s,box-shadow .15s}
.ov2-card:hover,.ov2-app:hover{transform:translateY(-2px);box-shadow:0 10px 24px #10182826}
.ov2-card:not(:last-child)::after{content:'→';position:absolute;top:50%;right:calc(-1 * clamp(12px,1.8cqw,30px));width:clamp(12px,1.8cqw,30px);text-align:center;transform:translateY(-50%);font-size:clamp(11px,1.2cqw,18px);font-weight:700;color:#08748f}
.ov2 .n{font-size:clamp(20px,2.8cqw,46px);font-weight:700;letter-spacing:-1px;line-height:1;color:#08748f}
.ov2-card .t{font-size:clamp(13px,1.65cqw,27px);font-weight:700;line-height:1.2}
.ov2-card .d{font-size:clamp(10.5px,1.2cqw,19px);line-height:1.4;color:var(--ink-body);flex:1}
.ov2 .r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(9px,.85cqw,13px);font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#08748f}
.ov2-card .r{padding-top:clamp(4px,.6cqw,10px);border-top:1px solid var(--blue-20)}
.ov2 .chev{width:1.5em;height:1.5em;flex-shrink:0}
.ov2-card.lead{background:linear-gradient(135deg,#0f1a2b,#101828 60%,#16243a);border-color:#101828;border-top-color:var(--cinc-blue);color:white;box-shadow:0 10px 26px #10182833}
.ov2-card.lead .n,.ov2-card.lead .r{color:#4fc6e8}
.ov2-card.lead .d{color:#dfe7ec}
.ov2-card.lead .r{border-top-color:#ffffff30}
.ov2-app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(10px,1.6cqw,26px);align-items:center;background:#f4f7f8;border:1px solid var(--rule);border-left:4px solid #9bb0ba;border-radius:var(--radius);padding:clamp(7px,1cqw,16px) clamp(12px,1.5cqw,24px);transition:transform .15s,box-shadow .15s}
.ov2-app .n{color:#7d939e}
.ov2-app .tt b{display:block;font-size:clamp(12px,1.4cqw,23px)}
.ov2-app .tt span{display:block;font-size:clamp(10px,1.1cqw,17px);line-height:1.35;color:var(--ink-body)}
.ov2-app .r{color:#5f7480}
@media(max-width:700px){.ov2-steps{grid-template-columns:1fr 1fr}.ov2-card:not(:last-child)::after{display:none}.ov2-app{grid-template-columns:auto 1fr}.ov2-app .r{grid-column:1 / -1}}
/* ---------- Cost of sale by channel: two-plan table, spend banner, footnote ---------- */
.cos{display:flex;flex-direction:column;gap:clamp(6px,.9cqw,14px);width:100%;min-height:0}
.cos-t{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:clamp(11.5px,1.6cqw,26px);color:var(--blue-black);box-shadow:0 3px 10px #10182814;border-radius:var(--radius);overflow:hidden}
.cos-t th,.cos-t td{padding:clamp(4px,.85cqw,14px) clamp(8px,1.1cqw,18px)}
.cos-t .top th{background:var(--blue-black);color:white;font-size:clamp(11px,1.6cqw,26px);font-weight:700;letter-spacing:.3px;text-align:center}
.cos-t .top th.ac{text-align:left;font-size:clamp(11px,1.45cqw,23px)}
.cos-t .top th.p1{background:var(--cinc-blue)}
.cos-t .sub th{background:white;color:var(--ink-muted);font-size:clamp(10px,1.25cqw,20px);font-weight:700;text-align:center;border-bottom:1px solid var(--rule)}
.cos-t .sub th.ch{text-align:left}
.cos-t tbody tr:nth-child(odd) td{background:#eaf2f6}
.cos-t tbody tr:nth-child(even) td{background:#f6f9fb}
.cos-t td.ch{text-align:left}.cos-t td.num{text-align:center}
.cos-t tbody tr.tot td{background:var(--blue-black);color:white;font-weight:700}
.cos-banner{background:var(--blue-10);border:1px solid var(--blue-20);border-radius:var(--radius);padding:clamp(6px,1cqw,16px) clamp(12px,1.6cqw,26px);font-size:clamp(12px,1.6cqw,26px);font-weight:700;color:#08748f;box-shadow:0 3px 10px #10182812;white-space:pre-wrap}

/* ---------- Alternate plan: two impact cards, an FTE line, and a dark summary bar ---------- */
.alt{display:flex;flex-direction:column;gap:clamp(8px,1.2cqw,20px);width:100%;min-height:0}
.alt-cards{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.2cqw,40px);flex:1;min-height:0}
.alt-card{background:var(--blue-10);border:1px solid var(--blue-20);border-top:4px solid var(--cinc-blue);border-radius:var(--radius);padding:clamp(8px,1.2cqw,20px) clamp(12px,1.7cqw,28px);box-shadow:0 3px 10px #10182814;display:flex;flex-direction:column;gap:clamp(3px,.6cqw,10px);min-height:0;overflow:hidden}
.alt-card .big{font-size:clamp(28px,3.9cqw,66px);font-weight:700;letter-spacing:-1.5px;line-height:1;color:var(--cinc-blue)}

.alt-ftes{white-space:pre-wrap;font-size:clamp(12px,1.6cqw,26px);font-weight:700;color:var(--blue-black);flex-shrink:0}
.alt-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2cqw,36px);background:var(--blue-black);color:white;border-radius:var(--radius);padding:clamp(9px,1.4cqw,24px) clamp(14px,1.8cqw,30px);box-shadow:0 8px 24px #10182833;flex-shrink:0}

@media(max-width:700px){.alt-cards,.alt-bar{grid-template-columns:1fr}}
/* ---------- Sales trend: monthly bars, three stat cards, source note ---------- */
.st{display:flex;flex-direction:column;gap:clamp(8px,1.1cqw,18px);width:100%;min-height:0}
.st-chart{flex:1;min-height:clamp(96px,14cqw,230px);display:grid;grid-template-rows:1fr auto auto;gap:clamp(2px,.4cqw,6px)}
.st-bars{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:clamp(3px,.6cqw,10px);min-height:0}
.st-cell{position:relative;min-height:0}
.st-cell .bar{position:absolute;left:6%;right:6%;bottom:0;height:calc(var(--p) * (100% - 1.7em));background:var(--cinc-blue);border-radius:2px 2px 0 0}

.st-labels{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:clamp(3px,.6cqw,10px);border-top:1px solid var(--rule);padding-top:clamp(2px,.35cqw,6px)}
.st-labels span{text-align:center;font-size:clamp(9px,.95cqw,15px);color:var(--ink-body)}
.st-years{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:clamp(3px,.6cqw,10px)}
.st-years span{font-size:clamp(9px,.9cqw,14px);font-weight:700;color:var(--ink-muted);letter-spacing:.4px}
.st-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.6cqw,26px);flex-shrink:0}
.st-stat{background:var(--blue-10);border:1px solid var(--blue-20);border-radius:var(--radius);padding:clamp(7px,1cqw,16px) clamp(12px,1.5cqw,24px);box-shadow:0 2px 8px #10182812}
.st-stat .big{font-size:clamp(22px,3.1cqw,52px);font-weight:700;letter-spacing:-1.2px;line-height:1.05;color:var(--cinc-blue)}

.st-src{font-size:clamp(8px,.78cqw,12px);line-height:1.4;color:var(--ink-muted);flex-shrink:0}
/* No bars: let the text fill the column instead of leaving a gap above the bottom line */
.cd.three.nobars .cd-col{gap:clamp(6px,.9cqw,16px)}
.cd.three.nobars .cd-head .big{font-size:clamp(38px,5.4cqw,88px)}
.cd.three.nobars .cd-head .ttl{font-size:clamp(15px,1.9cqw,30px)}
.cd.three.nobars .cd-col li{font-size:clamp(12px,1.42cqw,23px);padding:clamp(3px,.5cqw,9px) 0 clamp(3px,.5cqw,9px) 19px}

/* ---------- Event strategy: four kinds of events, one team focus, link to the calendar ---------- */
.es{display:flex;flex-direction:column;gap:clamp(8px,1.2cqw,22px);width:100%;min-height:0}

.es-col:last-child{padding-right:0}

.es-col ul{list-style:none;margin:0;padding:0}

.es-link{margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;gap:.5em;font-size:clamp(11px,1cqw,16px);font-weight:700;letter-spacing:.4px;color:white;text-decoration:none;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:clamp(6px,.75cqw,12px) clamp(12px,1.4cqw,22px);white-space:nowrap;transition:background .15s,border-color .15s}

}
@media(max-width:700px){.es-cols{grid-template-columns:1fr 1fr;gap:20px}.es-col{padding:0;border-left:0}.es-bar{flex-wrap:wrap}.es-link{margin-left:0}}

/* ---------- Presenter notes drawer ---------- */
.notes{display:none;position:fixed;right:0;bottom:0;width:min(440px,100%);max-height:45vh;overflow:auto;background:white;border:1px solid #d3dfe3;border-right:0;border-bottom:0;border-radius:8px 0 0 0;box-shadow:0 -8px 30px #10182822;padding:18px 22px 22px;z-index:5;font-size:14px;line-height:1.5;color:#34495a}

.notes p{font-size:14px;color:#34495a;margin:0 0 10px}
.notes p:last-child{margin:0}

/* ---------- Full-screen presentation ---------- */
:fullscreen .toolbar{display:none}
:fullscreen .deck{height:100dvh;padding:2vh 3vw}
:fullscreen .sheet{width:min(100%,calc((100dvh - 4vh) * 16 / 9));max-width:none}

/* ---------- Cover and divider pages: CINC Blue field, white logo, bold + light title ---------- */
.sheet:is([data-page=cover],[data-page=divider]){background:var(--cinc-blue);color:white;border-color:var(--cinc-blue)}
.sheet:is([data-page=cover],[data-page=divider]) .pattern{display:block}

.sheet:is([data-page=cover],[data-page=divider]) .brandline .label{display:none}
.sheet:is([data-page=cover],[data-page=divider]) .heading{flex:1;align-items:end;padding:0 clamp(8px,2vw,32px) clamp(16px,4vh,48px)}
.sheet:is([data-page=cover],[data-page=divider]) .chapter{display:none}
.sheet:is([data-page=cover],[data-page=divider]) h1{font-size:clamp(34px,7.5vw,112px);line-height:.98;letter-spacing:-2px;margin:0 0 18px;color:white}
.sheet:is([data-page=cover],[data-page=divider]) h1 .light{display:block;font-weight:400}
.sheet:is([data-page=cover],[data-page=divider]) p{font-size:clamp(14px,1.5vw,22px);color:white;opacity:.92;max-width:34em}
.sheet:is([data-page=cover],[data-page=divider]) .canvas{display:none}
.sheet:is([data-page=cover],[data-page=divider]) .footer{border-top-color:rgba(255,255,255,.45);color:white;padding:14px clamp(8px,2vw,32px) 0}
.sheet:is([data-page=cover],[data-page=divider]) .footer .label{color:white;letter-spacing:2.5px}
.sheet:is([data-page=cover],[data-page=divider]) .footer .label b{margin:0 14px;font-weight:400}
.sheet:is([data-page=cover],[data-page=divider]) .footer button{background:transparent;color:white;border-color:rgba(255,255,255,.55)}
.sheet:is([data-page=cover],[data-page=divider]) .footer button:hover{border-color:white}
.sheet:is([data-page=cover],[data-page=divider]) .footer #count{color:white}
.sheet:is([data-page=cover],[data-page=divider]) .brandline,.sheet:is([data-page=cover],[data-page=divider]) .heading,.sheet:is([data-page=cover],[data-page=divider]) .footer{position:relative;z-index:1}


/* ============ Premium pass: type scale, chrome, chips, radius (overrides the rules above) ============ */
:root{--t-title:clamp(24px,2.8cqw,44px);--t-lead:clamp(16px,1.6cqw,26px);--t-body:clamp(13px,1.15cqw,18px);--t-cap:clamp(10px,.8cqw,12px);--radius:8px;--ink-body:#34495a}

.heading p,#subtitle{font-size:clamp(14px,1.25cqw,20px);line-height:1.4;max-width:46em}
.label,.chapter,.fub-lab,.abm-seg .lab,.abm-row .lab,.fw-eyebrow,.tracker-eyebrow,.abm-loop .label,.abm-loop .node .step,.fw-focus .lab,.item dt,.bottomline .label{font-size:var(--t-cap);font-weight:700;letter-spacing:1.6px;text-transform:uppercase}

/* ---------- Tom Ferry slide: more air between columns, tags above titles, even rows ---------- */

}

// ======================= RENDERERS =======================
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function field(label, value, placeholder) {
  return '<dt>' + label + '</dt>' + (value ? '<dd>' + esc(value) + '</dd>' : '<dd class="todo">' + placeholder + '</dd>');
}
const CHEVRON = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function indexContent(interactive) {
  return '<div class="pillars">' + salesPlan.map((channel, i) => {
    const tag = interactive ? 'button' : 'div';
    const attrs = interactive ? ' onclick="goTo(' + channelStart[i] + ')"' : '';
    return '<' + tag + ' class="pillar"' + attrs + '><h2>' + (channel.partnerLogo ? '<img class="pillar-logo" src="' + channel.partnerLogo + '" alt="' + esc(channel.partnerName ?? channel.title) + '">' : esc(channel.title)) + '</h2><ul>' +
      channel.items.map(item => '<li>' + esc(item.name) + '</li>').join('') + '</ul>' +
      (interactive ? '<span class="go">View details →</span>' : '') + '</' + tag + '>';
  }).join('') + '</div>';

    const logo = '<div class="print-brand"><img src="' + (intro ? 'assets/cinc-logo-dark-bg.svg' : 'assets/cinc-logo-light-bg.svg') + '" alt="CINC">' + (page.partnerLogo ? '<span class="x">×</span><img class="partner-logo" src="' + page.partnerLogo + '" alt="' + esc(page.partnerName ?? '') + '">' : '') + '</div>';
    const body = page.type === 'index' ? indexContent(false) : page.content ? page.content() : '';
    const actions = page.headingActions ? '<div class="heading-actions">' + page.headingActions() + '</div>' : '';
    return '<section class="printslide print-intro ' + (page.type ?? 'slide') + '">' + logo +
      '<div class="heading"><div>' + (page.chapter ? '<div class="chapter">' + page.chapter + '</div>' : '') + '<h1>' + titleHtml(page) + '</h1><p>' + esc(page.subtitle ?? '') + '</p></div>' + actions + '</div>' +
      '<div class="canvas">' + body + '</div>' + (intro ? '' : '<div class="print-foot"><span>Confidential · Internal</span><span>CINC · 2027 Annual Plan</span></div>') + '</section>';
  }).join('');
}
function printDeck() { buildPrint(); window.print(); }
if (location.search.includes('print')) buildPrint();
// ---- Arrange panel: drag slides into the five parts of the plan ----
const GROUPS_KEY = 'cinc-2027-slide-groups-v3';
const ARR_GROUPS = [{ id: 'open', name: 'Opening: cover and overview' }]
  .concat(overviewParts.map((x, i) => ({ id: 'p' + (i + 1), name: x.title, no: x.num })))
  .concat([{ id: 'unplaced', name: 'Not yet placed' }]);
let arrWork = {}, arrDrag = null;
function savedGroups() { try { const v = JSON.parse(localStorage.getItem(GROUPS_KEY)); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; } }
function arrInitial() {
  const saved = savedGroups(), w = {};
  ARR_GROUPS.forEach(g => { w[g.id] = []; });
  pages.forEach(p => {
    let g = saved[pageKeys.get(p)];
    if (!w[g]) g = (p.type === 'cover' || p.chapter === 'Overview' || p.toc) ? 'open' : (p.part ? 'p' + p.part : 'unplaced');
    w[g].push(p);
  });
  return w;
}
const arrFlat = () => ARR_GROUPS.flatMap(g => arrWork[g.id]);
const aid = p => DEFAULT_ORDER.indexOf(p);
function arrBuild() {
  if (document.getElementById('arr')) return;
  const el = document.createElement('div');
  el.id = 'arr'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Arrange slides');
  el.innerHTML = '<div class="arr-card"><div class="arr-head"><div><h2>Arrange slides</h2><p id="arr-intro"></p></div><button type="button" id="arr-x">Cancel</button></div>' +
    '<div class="arr-body" id="arr-body"></div><div class="arr-foot"><button type="button" id="arr-reset">Reset to original order</button><button type="button" id="arr-copy">Copy order</button><span class="sp"></span><button type="button" class="primary" id="arr-save">Save order</button><div class="arr-msg" id="arr-msg" role="status"></div></div></div>';
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) closeArrange(); });
  document.getElementById('arr-x').onclick = closeArrange;
  document.getElementById('arr-save').onclick = arrSave;
  document.getElementById('arr-reset').onclick = arrReset;
  document.getElementById('arr-copy').onclick = arrCopy;
  const body = document.getElementById('arr-body');
  body.onclick = e => {
    const b = e.target.closest('[data-mv]'); if (!b || b.disabled) return;
    const g = b.dataset.g, i = +b.dataset.i, d = +b.dataset.mv, list = arrWork[g], p = list[i];
    arrPlace(p, g, i + d, true); arrRender({ a: aid(p), mv: d });
  };
  body.onchange = e => {
    const sel = e.target.closest('.arr-sel'); if (!sel) return;
    const p = DEFAULT_ORDER[+sel.dataset.a]; arrPlace(p, sel.value, Infinity, false); arrRender({ a: aid(p), sel: true });
  };
  body.ondragstart = e => { const r = e.target.closest('.arr-row'); if (!r) return; arrDrag = DEFAULT_ORDER[+r.dataset.a]; r.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(r.dataset.a)); } catch (x) {} };
  body.ondragover = e => {
    if (!arrDrag) return; const l = e.target.closest('.arr-gl'); if (!l) return; e.preventDefault();
    body.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
    const r = e.target.closest('.arr-row'); if (r) r.classList.add('over'); else l.classList.add('over');
  };
  body.ondrop = e => {
    if (!arrDrag) return; const l = e.target.closest('.arr-gl'); if (!l) return; e.preventDefault();
    const r = e.target.closest('.arr-row'); const p = arrDrag; arrDrag = null;
    if (r && DEFAULT_ORDER[+r.dataset.a] === p) { arrRender(); return; }
    let idx = Infinity; if (r) idx = arrWork[l.dataset.g].indexOf(DEFAULT_ORDER[+r.dataset.a]);
    arrPlace(p, l.dataset.g, idx, false); arrRender({ a: aid(p) });
  };
  body.ondragend = () => { arrDrag = null; body.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); };
}
function arrMsg(t) { document.getElementById('arr-msg').textContent = t; }
// Move slide p into group g at position idx (Infinity = the end).
function arrPlace(p, g, idx, sameGroupSwap) {
  let from = -1, fromG = null;
  ARR_GROUPS.forEach(x => { const k = arrWork[x.id].indexOf(p); if (k >= 0) { from = k; fromG = x.id; } });
  if (sameGroupSwap && (idx < 0 || idx >= arrWork[g].length)) return;
  arrWork[fromG].splice(from, 1);
  if (fromG === g && from < idx && idx !== Infinity) idx = sameGroupSwap ? idx : idx - 1;
  const list = arrWork[g]; list.splice(idx === Infinity ? list.length : Math.max(0, idx), 0, p);
}
function arrRender(focus) {
  const cur = pages[pageIndex], flat = arrFlat(), body = document.getElementById('arr-body');
  const opts = sel => ARR_GROUPS.map(g => '<option value="' + g.id + '"' + (g.id === sel ? ' selected' : '') + '>' + esc(g.id === 'open' ? 'Opening' : g.name) + '</option>').join('');
  const row = (p, g, i, n) => {
    const sub = p.chapter && p.chapter !== p.title ? '<small>' + esc(p.chapter) + '</small>' : '';
    return '<li class="arr-row' + (p.type === 'divider' ? ' divider' : '') + (p === cur ? ' now' : '') + '" draggable="true" data-a="' + aid(p) + '"><span class="arr-grip" aria-hidden="true">⋮⋮</span><span class="arr-num">' + (flat.indexOf(p) + 1) + '</span>' +
      '<span class="arr-t"><b>' + esc(p.title || '') + (p.titleLight ? ' ' + esc(p.titleLight) : '') + (p === cur ? '<span class="arr-tag">Viewing</span>' : '') + '</b>' + sub + '</span>' +
      '<span class="arr-ctl"><select class="arr-sel" data-a="' + aid(p) + '" aria-label="Move to">' + opts(g) + '</select><button type="button" data-mv="-1" data-g="' + g + '" data-i="' + i + '" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>↑</button><button type="button" data-mv="1" data-g="' + g + '" data-i="' + i + '" aria-label="Move down"' + (i === n - 1 ? ' disabled' : '') + '>↓</button></span></li>';
  };
  const box = g => {
    const list = arrWork[g.id];
    const rows = list.length ? list.map((p, i) => row(p, g.id, i, list.length)).join('') : '<li class="arr-empty">Drop slides here</li>';
    const cls = g.id === 'open' ? ' open-g' : g.id === 'unplaced' ? ' unplaced' : g.id === 'p5' ? ' appx' : '';
    return '<section class="arr-g' + cls + '"><h3>' + (g.no ? '<span class="no">' + esc(g.no) + '</span>' : '') + esc(g.name) + '<span class="cnt">' + list.length + (list.length === 1 ? ' slide' : ' slides') + '</span></h3><ol class="arr-gl" data-g="' + g.id + '">' + rows + '</ol></section>';
  };
  const left = ARR_GROUPS.filter(g => g.id !== 'unplaced').map(box).join('');
  body.innerHTML = '<div class="arr-col">' + left + '</div><div class="arr-col">' + box(ARR_GROUPS[ARR_GROUPS.length - 1]) + '</div>';
  if (focus) {
    let el = null;
    if (focus.sel) el = body.querySelector('.arr-sel[data-a="' + focus.a + '"]');
    else if (focus.mv) el = body.querySelector('.arr-row[data-a="' + focus.a + '"] [data-mv="' + focus.mv + '"]:not(:disabled)') || body.querySelector('.arr-row[data-a="' + focus.a + '"] [data-mv]:not(:disabled)');
    const r = body.querySelector('.arr-row[data-a="' + focus.a + '"]');
    if (el) el.focus(); if (r) r.scrollIntoView({ block: 'nearest' });
  }
}
function openArrange() {
  arrBuild();
  arrWork = arrInitial();
  arrMsg('');
  document.getElementById('arr-intro').textContent = 'Drag each slide into the part of the plan it belongs to, or use the "Move to" menu on a row. Use the arrows to change the order inside a part. Slides you have not sorted stay under "Not yet placed". Your arrangement is saved in this browser only. When you are happy with it, click Copy order and send it to me.';
  document.getElementById('arr').classList.add('open');
  arrRender();
  const now = document.querySelector('#arr-body .arr-row.now'); if (now) now.scrollIntoView({ block: 'center' });
  document.getElementById('arr-save').focus();
}
function closeArrange() { const el = document.getElementById('arr'); if (el) el.classList.remove('open'); document.getElementById('arrange-btn').focus(); }
function arrSave() {
  try {
    const flat = arrFlat(), gm = {};
    ARR_GROUPS.forEach(g => arrWork[g.id].forEach(p => { gm[pageKeys.get(p)] = g.id; }));
    localStorage.setItem(ORDER_KEY, JSON.stringify(flat.map(p => pageKeys.get(p))));
    localStorage.setItem(GROUPS_KEY, JSON.stringify(gm));
    try { sessionStorage.setItem('cinc-current', pageKeys.get(pages[pageIndex])); } catch (e) {}
    location.reload();
  } catch (e) { arrMsg('This browser would not save the arrangement (private window or blocked storage). Use Copy order instead.'); }
}
function arrReset() {
  try { localStorage.removeItem(ORDER_KEY); localStorage.removeItem(GROUPS_KEY); try { sessionStorage.setItem('cinc-current', pageKeys.get(pages[pageIndex])); } catch (e) {} location.reload(); } catch (e) { arrMsg('Could not reset in this browser.'); }
}
function arrCopy() {
  const flat = arrFlat(); let text = '';
  ARR_GROUPS.forEach(g => {
    const list = arrWork[g.id]; if (!list.length && g.id === 'unplaced') return;
    text += (text ? '\n' : '') + (g.no ? g.no + '. ' : '') + g.name.toUpperCase() + '\n';
    text += list.length ? list.map(p => flat.indexOf(p) + 1 + '. ' + (p.title || '') + (p.titleLight ? ' ' + p.titleLight : '')).join('\n') + '\n' : '(none)\n';
  });
  const done = () => arrMsg('Order copied. Paste it into a message to me.');
  const fail = () => arrMsg('Copy was blocked in this browser. Select the lists by hand instead.');
  try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
}
document.addEventListener('keydown', e => { const arr = document.getElementById('arr'); if (arr && arr.classList.contains('open')) { if (e.key === 'Escape') closeArrange(); return; } if (e.key === 'Escape') closeLightbox(); if (e.key === 'ArrowRight') move(1); if (e.key === 'ArrowLeft') move(-1); if ((e.key === 'c' || e.key === 'C') && !e.metaKey && !e.ctrlKey && !e.altKey) goToToc(); });
render();
